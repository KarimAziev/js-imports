name: check

on:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - 28.1
          - 29.1
          - 30.2
          - snapshot
        ignore_warnings:
          - false
    steps:
    - uses: actions/checkout@v7
    - uses: purcell/setup-emacs@master
      with:
        version: ${{ matrix.emacs_version }}
    - uses: leotaku/elisp-check@master
      with:
        file: js-imports.el
        ignore_warnings: ${{ matrix.ignore_warnings }}
